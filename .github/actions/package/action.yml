name: Build package
inputs:
  debug:
    description: Enable debug
    default: false
  package:
    description: Package to build
    required: true
runs:
  using: composite
  steps:
    - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
    - uses: azuwis/actions/debug@main
      if: ${{ inputs.debug }}
    - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
    - name: Build
      env:
        PACKAGE: ${{ inputs.package }}
      shell: bash
      run: |
        package=$PACKAGE
        if [ "$(nix-instantiate --argstr package "$package" --eval --json --expr '
        { package }:
        let
          pkgs = import ./pkgs { };
          inherit (pkgs) lib;
          pkg = lib.attrByPath (lib.splitString "." package) null pkgs;
        in
          lib.meta.availableOn pkgs.stdenv.hostPlatform pkg
        ')" = false ]; then
          echo "::notice::Skip build, wrong platform"
          echo "CACHE_NEED_UPDATE=no" >>"$GITHUB_ENV"
          touch ~/package-skip-build
          exit
        fi
        echo "::group::Build $package"
        nix-build pkgs --attr "$package"
        echo "::endgroup::"
        if [ "$(nix-instantiate --argstr package "$package" --eval --json --expr '
        { package }:
        let
          pkgs = import ./pkgs { };
          inherit (pkgs) lib;
          pkg = lib.attrByPath (lib.splitString "." package) null pkgs;
        in
          pkg ? tests
        ')" = true ]; then
          echo "::group::Test $package"
          nix-build pkgs --attr "$package.tests"
          echo "::endgroup::"
        fi
        echo "::group::Install 'tree'"
        nix-env -f '<nixpkgs>' -iA tree
        echo "::endgroup::"
        echo "::group::List files of $package"
        tree -a result
        echo "::endgroup::"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ env.CACHE_NEED_UPDATE == 'no' }}
      with:
        key: package-skip-build-${{ inputs.package }}-${{ runner.os }}-${{ runner.arch }}
        path: ~/package-skip-build
